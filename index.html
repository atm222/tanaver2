<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>QR棚卸</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --c: #14538f; --fg: #fff; }
  body[data-state="waiting"]    { --c: #14538f; --fg: #fff; }
  body[data-state="processing"] { --c: #d97a00; --fg: #fff; }
  body[data-state="ok"]         { --c: #0f8f45; --fg: #fff; }
  body[data-state="dup"]        { --c: #f2c200; --fg: #2a2200; }
  body[data-state="err"]        { --c: #cc2b1d; --fg: #fff; }
  body[data-state="stopped"]    { --c: #5c6470; --fg: #fff; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    background: var(--c); color: var(--fg);
    transition: background-color .12s linear; min-height: 100vh;
  }
  header { background: rgba(0,0,0,.38); color: #fff; padding: 8px 12px; }
  .hrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .htitle { font-size: 15px; font-weight: 800; }
  /* 送信状況バッジ（背景色とは独立。スキャンの邪魔をしない） */
  #netBadge {
    font-size: 13px; font-weight: 800; padding: 5px 10px; border-radius: 999px;
    background: #0f8f45; color: #fff; white-space: nowrap;
  }
  #netBadge.wait { background: #d97a00; }
  #netBadge.off  { background: #cc2b1d; }
  #netBadge.send { background: #1f6feb; }
  #counts { font-size: 12px; opacity: .92; margin-top: 4px; }

  main { padding: 10px; max-width: 620px; margin: 0 auto; }

  #modeRow { display: flex; gap: 8px; margin-bottom: 10px; }
  #modeRow button {
    flex: 1; padding: 14px 6px; font-size: 16px; font-weight: 800;
    border: 3px solid rgba(255,255,255,.75); border-radius: 12px;
    background: rgba(0,0,0,.18); color: var(--fg); cursor: pointer;
  }
  #modeRow button.sel { background: #fff; color: #16202c; border-color: #fff; }

  #camWrap {
    position: relative; border-radius: 14px; overflow: hidden; background: #000;
    border: 10px solid #fff; box-shadow: 0 0 0 6px rgba(255,255,255,.25);
    transition: border-color .12s linear, box-shadow .12s linear;
  }
  body[data-state="ok"] #camWrap, body[data-state="dup"] #camWrap, body[data-state="err"] #camWrap {
    border-width: 16px; border-color: var(--fg); box-shadow: 0 0 0 10px rgba(255,255,255,.55);
  }
  #reader { width: 100%; }
  #reader video { width: 100% !important; display: block; }

  #hidPane { border: 6px dashed rgba(255,255,255,.6); border-radius: 14px; padding: 14px; text-align: center; background: rgba(0,0,0,.14); }
  #hidState { font-size: 17px; font-weight: 800; margin-bottom: 10px; }
  #hidInput { width: 100%; padding: 14px; font-size: 20px; font-weight: 700; border: none; border-radius: 10px; text-align: center; color: #16202c; }
  .hint { font-size: 12px; opacity: .9; margin-top: 8px; line-height: 1.6; text-align: left; }

  #panel { margin: 10px 0; padding: 14px 12px; border-radius: 14px; background: rgba(0,0,0,.22); text-align: center; }
  body[data-state="dup"] #panel { background: rgba(0,0,0,.12); }
  #icon { font-size: 68px; line-height: 1; font-weight: 900; }
  #label { font-size: 30px; font-weight: 900; margin-top: 4px; letter-spacing: .04em; }
  #detail { font-size: 15px; font-weight: 600; margin-top: 6px; opacity: .95; word-break: break-all; min-height: 18px; }
  body[data-state="processing"] #panel { animation: blink .7s ease-in-out infinite alternate; }
  @keyframes blink { from { opacity: .55; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #panel { animation: none !important; } }

  .row { display: flex; gap: 8px; margin: 8px 0; }
  button { flex: 1; padding: 15px 8px; font-size: 16px; font-weight: 800; border: none; border-radius: 12px; color: #16202c; background: #fff; cursor: pointer; }
  button:active { transform: scale(.98); }
  button.ghost { background: rgba(255,255,255,.22); color: var(--fg); border: 2px solid rgba(255,255,255,.7); }
  button.on { background: #ffe680; color: #3a2c00; }
  .vol { display: flex; gap: 6px; margin: 8px 0; }
  .vol button { padding: 12px 4px; font-size: 15px; }
  .vol button.sel { background: #16202c; color: #fff; }
  .cap { font-size: 12px; font-weight: 700; opacity: .9; margin: 10px 0 2px; }
  input[type=range] { width: 100%; height: 34px; }

  #listWrap { display: none; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; color: #1a1a1a; border-radius: 10px; overflow: hidden; }
  th, td { padding: 8px 6px; font-size: 13px; text-align: left; border-bottom: 1px solid #e0e3e8; }
  th { background: #eef0f3; }
  td.s-sent { color: #0f8f45; font-weight: 700; }
  td.s-queued { color: #d97a00; font-weight: 700; }
  td.s-dup { color: #9a7b00; font-weight: 700; }
  .content-cell { word-break: break-all; }
  .empty { color: #888; text-align: center; padding: 16px; }
  .note { font-size: 12px; opacity: .9; margin: 6px 0; line-height: 1.6; }

  /* ===== 未送信ゼロになるまで出し続ける警告バー ===== */
  body.has-unsent { padding-bottom: 104px; }
  #alertBar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999;
    display: none; align-items: center; gap: 10px;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    background: #cc2b1d; color: #fff; border-top: 4px solid #fff;
    box-shadow: 0 -6px 18px rgba(0,0,0,.4);
  }
  #alertBar.show { display: flex; animation: alertPulse 1.3s ease-in-out infinite alternate; }
  @keyframes alertPulse { from { background: #cc2b1d; } to { background: #8e1b11; } }
  @media (prefers-reduced-motion: reduce) { #alertBar.show { animation: none; } }
  #alertText { flex: 1; font-size: 17px; font-weight: 900; line-height: 1.3; }
  #alertText small { display: block; font-size: 12px; font-weight: 700; opacity: .95; margin-top: 3px; }
  #alertBar button { flex: 0 0 auto; padding: 13px 14px; font-size: 15px; background: #fff; color: #8e1b11; }
  #doneBar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9998; display: none;
    padding: 15px 12px calc(15px + env(safe-area-inset-bottom));
    background: #0f8f45; color: #fff; font-size: 18px; font-weight: 900; text-align: center;
  }
  #doneBar.show { display: block; }
</style>
</head>
<body data-state="stopped">
<header>
  <div class="hrow">
    <span class="htitle">📦 QR棚卸</span>
    <span id="netBadge">送信待機</span>
  </div>
  <div id="counts">読取 0 件 ／ 未送信 0 件</div>
</header>

<main>
  <div id="modeRow">
    <button id="modeCam" class="sel">📷 カメラ</button>
    <button id="modeHid">🔫 リーダー</button>
  </div>

  <div id="camWrap"><div id="reader"></div></div>

  <div id="hidPane" style="display:none;">
    <div id="hidState">リーダーの読み取り待ち</div>
    <input id="hidInput" type="text" inputmode="text" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="ここに読み取り結果が入ります" />
    <div class="row" style="margin-top:8px;">
      <button id="btnManual" class="ghost">入力内容を登録</button>
      <button id="btnClear" class="ghost">消去</button>
    </div>
    <div class="hint">
      ・Bluetooth接続後、この欄に自動で値が入ります（タップ不要）<br>
      ・リーダー側の設定：接続モード「BT HID」／ターミネーター「Enter」／キーボード言語「US」
    </div>
  </div>

  <div id="panel">
    <div id="icon">■</div>
    <div id="label">起動中</div>
    <div id="detail"></div>
  </div>

  <div class="row">
    <button id="btnToggle">スキャン停止</button>
    <button id="btnList" class="ghost">一覧を表示</button>
  </div>

  <div class="row">
    <button id="btnSendNow">今すぐ送信</button>
    <button id="btnCsv" class="ghost">CSV書き出し</button>
  </div>

  <div class="row">
    <button id="btnFinish">作業終了チェック</button>
  </div>

  <div class="row">
    <button id="btnTorch" class="ghost" style="display:none;">ライト</button>
    <button id="btnReload" class="ghost">シート照合</button>
  </div>

  <div id="zoomWrap" style="display:none;">
    <div class="cap">ズーム（遠くのQRを読むとき）</div>
    <input type="range" id="zoom" min="1" max="4" step="0.1" value="1" />
  </div>

  <div class="cap">音量</div>
  <div class="vol" id="volRow">
    <button data-v="0">消音</button><button data-v="1">小</button>
    <button data-v="2">中</button><button data-v="3">大</button><button data-v="4">最大</button>
  </div>
  <div class="row">
    <button id="btnTest" class="ghost">音を確認</button>
    <button id="btnSpeak" class="ghost">音声読み上げ：オフ</button>
  </div>

  <div class="note" id="storeNote"></div>
  <div id="vibNote" class="note" style="display:none;">※この端末は振動非対応のため、音と画面表示でお知らせします。</div>

  <div id="listWrap">
    <table>
      <thead><tr><th>順</th><th>日時</th><th>QR内容</th><th>状態</th></tr></thead>
      <tbody id="list"><tr><td colspan="4" class="empty">まだスキャンがありません</td></tr></tbody>
    </table>
  </div>
</main>

<!-- 未送信が1件でもある限り消えない警告 -->
<div id="alertBar">
  <div id="alertText">
    ⚠ 未送信 <span id="alertCount">0</span> 件
    <small>送信が完了するまで作業を終了しないでください</small>
  </div>
  <button id="alertSend">今すぐ送信</button>
</div>
<div id="doneBar">✓ すべて送信済みです</div>

<script>
  // ===== 設定 =====================================================
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxTGviS-98Mww0jwSy-tPN04KXmOsHi057wBD6RyT7ZKZgQho4RlhqcQsoVAEfrz0h5/exec';
  const TOKEN = 'tana2026secret';

  const DEDUP_MS    = 3000;   // 同一コードの連続読み取りを無視する時間
  const HOLD_MS     = 1500;   // 成功/重複/失敗の表示を保持する時間
  const FAST_KEY_MS = 60;     // これより速い連続入力はリーダー入力とみなす

  const SEND_INTERVAL_MS = 10000;  // 送信ワーカーの起動間隔（10秒ごとに接続を確認）
  const BATCH_SIZE       = 50;     // 1回の送信でまとめる最大件数
  const BACKOFF_MAX_MS   = 120000; // 失敗時の最大待ち時間（2分）
  const SEND_TIMEOUT_MS  = 15000;  // 1回の送信の打ち切り時間
  // ================================================================

  const $ = id => document.getElementById(id);
  const iconEl=$('icon'), labelEl=$('label'), detailEl=$('detail');
  const countsEl=$('counts'), netBadge=$('netBadge');
  const listEl=$('list'), listWrap=$('listWrap');
  const camWrap=$('camWrap'), hidPane=$('hidPane'), hidInput=$('hidInput'), hidState=$('hidState');
  const modeCam=$('modeCam'), modeHid=$('modeHid');
  const btnToggle=$('btnToggle'), btnList=$('btnList'), btnReload=$('btnReload');
  const btnTorch=$('btnTorch'), btnTest=$('btnTest'), btnSpeak=$('btnSpeak');
  const zoomWrap=$('zoomWrap'), zoomEl=$('zoom');

  const vibrateSupported = 'vibrate' in navigator;
  if (!vibrateSupported) $('vibNote').style.display = 'block';

  let mode = 'cam';
  let lastContent = null, lastAt = 0;
  let scanner = null, running = false;
  let holdTimer = null;
  const registered = new Set();   // 登録済みQR内容（重複判定用）

  // ================================================================
  // ローカル保管庫：IndexedDB（使えない端末ではメモリに自動切替）
  // 1件ごとに uuid を振るため、再送しても二重登録になりません
  // ================================================================
  const DB_NAME = 'qr_tanaoroshi', STORE = 'scans', DB_VER = 1;
  let db = null, memRows = [], useMemory = false;

  function openDB() {
    return new Promise(resolve => {
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VER); }
      catch (e) { useMemory = true; return resolve(); }
      req.onupgradeneeded = ev => {
        const d = ev.target.result;
        if (!d.objectStoreNames.contains(STORE)) {
          const st = d.createObjectStore(STORE, { keyPath: 'uuid' });
          st.createIndex('status', 'status');
          st.createIndex('seq', 'seq');
        }
      };
      req.onsuccess = () => { db = req.result; resolve(); };
      req.onerror   = () => { useMemory = true; resolve(); };
      setTimeout(() => { if (!db && !useMemory) { useMemory = true; resolve(); } }, 3000);
    });
  }
  function tx(mode) { return db.transaction(STORE, mode).objectStore(STORE); }
  function dbPut(row) {
    if (useMemory) {
      const i = memRows.findIndex(r => r.uuid === row.uuid);
      if (i >= 0) memRows[i] = row; else memRows.push(row);
      return Promise.resolve();
    }
    return new Promise((res, rej) => { const r = tx('readwrite').put(row); r.onsuccess = res; r.onerror = rej; });
  }
  function dbPutMany(rows) { return Promise.all(rows.map(dbPut)); }
  function dbAll() {
    if (useMemory) return Promise.resolve(memRows.slice());
    return new Promise(res => { const r = tx('readonly').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); });
  }

  function uuid() {
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  // ===== 状態表示 =================================================
  const FACE = {
    waiting:    { icon: '▣', label: '読み取り待ち' },
    processing: { icon: '⟳', label: '処理中' },
    ok:         { icon: '✓', label: '記録しました' },
    dup:        { icon: '↺', label: '登録済み（重複）' },
    err:        { icon: '✕', label: '記録できません' },
    stopped:    { icon: '■', label: '停止中' }
  };
  function setState(type, detail, hold) {
    clearTimeout(holdTimer);
    document.body.dataset.state = type;
    iconEl.textContent = FACE[type].icon;
    labelEl.textContent = FACE[type].label;
    detailEl.textContent = detail || '';
    if (hold) holdTimer = setTimeout(idleState, HOLD_MS);
  }
  function idleState() {
    clearTimeout(holdTimer);
    if (mode === 'hid') { setState('waiting', 'リーダーで読み取ってください'); return; }
    if (running) setState('waiting', 'QRコードをかざしてください');
    else setState('stopped', '「スキャン開始」を押してください');
  }

  function formatNow() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function vibrate(p) { if (vibrateSupported) navigator.vibrate(p || 200); }

  // ===== 画面更新 =================================================
  let viewRows = [];
  async function refreshView() {
    viewRows = (await dbAll()).sort((a, b) => b.seq - a.seq);
    const unsent = viewRows.filter(r => r.status === 'queued').length;
    const total  = viewRows.length;
    countsEl.textContent = '読取 ' + total + ' 件 ／ 未送信 ' + unsent + ' 件';
    paintBadge(unsent);
    updateAlert(unsent);
    if (listWrap.style.display === 'block') renderList();
  }
  function renderList() {
    if (viewRows.length === 0) {
      listEl.innerHTML = '<tr><td colspan="4" class="empty">まだスキャンがありません</td></tr>';
      return;
    }
    const LABEL = { queued: '未送信', sent: '送信済', dup: '重複' };
    listEl.innerHTML = viewRows.slice(0, 200).map(r =>
      '<tr><td>' + r.seq + '</td><td>' + r.scannedAt + '</td>'
      + '<td class="content-cell">' + escapeHtml(r.content) + '</td>'
      + '<td class="s-' + r.status + '">' + (LABEL[r.status] || r.status) + '</td></tr>'
    ).join('');
  }

  let sending = false;
  function paintBadge(unsent) {
    if (sending)            { netBadge.className = 'send'; netBadge.textContent = '送信中…'; return; }
    if (!navigator.onLine)  { netBadge.className = 'off';  netBadge.textContent = '🔴 圏外 ' + unsent + '件保留'; return; }
    if (unsent > 0)         { netBadge.className = 'wait'; netBadge.textContent = '🟡 未送信 ' + unsent + '件'; return; }
    netBadge.className = ''; netBadge.textContent = '🟢 送信済み';
  }

  // ===== 音 =======================================================
  const VOL = [0, 0.2, 0.5, 1.0, 1.8];
  let volIdx = 3, audioCtx = null, master = null, comp = null;
  function initAudio() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.ratio.value = 12;
        master = audioCtx.createGain(); master.gain.value = VOL[volIdx];
        comp.connect(master); master.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function setVolume(i) {
    volIdx = i;
    if (master) master.gain.value = VOL[i];
    [...document.querySelectorAll('#volRow button')].forEach(b => b.classList.toggle('sel', Number(b.dataset.v) === i));
  }
  function tone(freq, dur, delay) {
    if (!audioCtx || VOL[volIdx] === 0) return;
    try {
      const t = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.value = freq;
      osc.connect(g); g.connect(comp);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.6, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.start(t); osc.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function beepOk()  { tone(1180, .10, 0); tone(1570, .12, .09); }
  function beepDup() { tone(760, .14, 0);  tone(760, .14, .20); }
  function beepErr() { tone(300, .22, 0);  tone(240, .30, .26); }

  let speakOn = false;
  function speak(text) {
    if (!speakOn || !('speechSynthesis' in window)) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; u.rate = 1.15;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) {}
  }
  document.addEventListener('touchstart', initAudio, { once: true });
  document.addEventListener('click', initAudio, { once: true });

  // ===== 読み取り（通信を待たず、必ずローカルに確定させる） =======
  let seqMax = 0;
  async function onScan(decodedText) {
    const code = String(decodedText).trim();
    if (!code) return;
    const now = Date.now();
    if (code === lastContent && now - lastAt < DEDUP_MS) return;
    lastContent = code; lastAt = now;

    if (registered.has(code)) {
      setState('dup', code, true);
      beepDup(); vibrate([60,60,60]); speak('登録済みです');
      return;
    }

    const row = {
      uuid: uuid(), seq: ++seqMax, content: code,
      scannedAt: formatNow(), status: 'queued',
      device: navigator.userAgent.slice(0, 120)
    };
    try {
      await dbPut(row);
      registered.add(code);
      setState('ok', code, true);
      beepOk(); vibrate(200); speak('記録しました');
      await refreshView();
      kickSender();               // 電波があればすぐ送る。なければ保留のまま
    } catch (e) {
      setState('err', '端末に保存できません：' + code, true);
      beepErr(); vibrate([120,80,120]); speak('保存できません');
    }
  }

  // ================================================================
  // 送信ワーカー：10秒ごとに接続を確認し、未送信をまとめて送る
  // ================================================================
  let backoff = 0, nextAllowedAt = 0;

  function kickSender() { if (Date.now() >= nextAllowedAt) sendQueued(); }

  async function sendQueued(manual) {
    if (sending) return;
    const all = await dbAll();
    const queued = all.filter(r => r.status === 'queued').sort((a, b) => a.seq - b.seq);
    if (queued.length === 0) { backoff = 0; await refreshView(); return; }
    if (!manual && Date.now() < nextAllowedAt) return;
    if (!navigator.onLine) { await refreshView(); return; }

    const batch = queued.slice(0, BATCH_SIZE);
    sending = true; paintBadge(queued.length);

    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), SEND_TIMEOUT_MS);
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        signal: ctl.signal,
        body: JSON.stringify({
          token: TOKEN,
          rows: batch.map(r => ({ uuid: r.uuid, content: r.content, scannedAt: r.scannedAt, device: r.device }))
        })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'server error');

      const accepted  = new Set(data.accepted  || []);
      const duplicated = new Set(data.duplicated || []);
      const updated = batch
        .filter(r => accepted.has(r.uuid) || duplicated.has(r.uuid))
        .map(r => Object.assign({}, r, { status: duplicated.has(r.uuid) ? 'dup' : 'sent', sentAt: formatNow() }));
      await dbPutMany(updated);

      backoff = 0; nextAllowedAt = 0;
      sending = false;
      await refreshView();

      // まだ残っていれば続けて送る
      const rest = (await dbAll()).filter(r => r.status === 'queued').length;
      if (rest > 0) setTimeout(() => sendQueued(), 400);
    } catch (e) {
      // 失敗しても端末内のデータは消えない。待ち時間を倍にして再挑戦
      backoff = backoff ? Math.min(backoff * 2, BACKOFF_MAX_MS) : SEND_INTERVAL_MS;
      nextAllowedAt = Date.now() + backoff;
      sending = false;
      await refreshView();
    } finally {
      clearTimeout(timer);
    }
  }

  setInterval(() => sendQueued(), SEND_INTERVAL_MS);
  window.addEventListener('online',  () => { backoff = 0; nextAllowedAt = 0; sendQueued(true); refreshView(); });
  window.addEventListener('offline', () => refreshView());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      sendQueued(true);
      if (mode === 'cam' && !running) startScan();
    }
  });

  // 未送信が残ったまま閉じようとしたら警告
  window.addEventListener('beforeunload', e => {
    const unsent = viewRows.filter(r => r.status === 'queued').length;
    if (unsent > 0) { e.preventDefault(); e.returnValue = ''; }
  });

  // ===== シート照合（既存データを重複判定に取り込む） =============
  async function loadAll() {
    setState('processing', 'シートを照合中');
    try {
      const res = await fetch(GAS_URL + '?action=list&limit=2000&token=' + encodeURIComponent(TOKEN));
      const data = await res.json();
      if (data.ok) {
        (data.rows || []).forEach(r => registered.add(String(r.content)));
        setState('ok', 'シートの ' + (data.rows || []).length + ' 件を重複判定に反映しました', true);
        beepOk();
      } else { setState('err', 'シートを照合できません', true); beepErr(); }
    } catch (e) {
      setState('err', 'シートを照合できません（通信エラー）', true); beepErr();
    }
    await refreshView();
  }

  // ===== CSV書き出し（最後の保険） ================================
  async function exportCsv() {
    const rows = (await dbAll()).sort((a, b) => a.seq - b.seq);
    if (!rows.length) { setState('err', '書き出すデータがありません', true); return; }
    const head = 'uuid,seq,scannedAt,content,status\n';
    const body = rows.map(r =>
      [r.uuid, r.seq, r.scannedAt, '"' + String(r.content).replace(/"/g, '""') + '"', r.status].join(',')
    ).join('\n');
    const blob = new Blob(['﻿' + head + body], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tanaoroshi_' + Date.now() + '.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // ===== リーダー(HID)入力 ========================================
  let keyTimes = [], commitTimer = null, hidSeen = false;
  function isFastInput() {
    if (keyTimes.length < 3) return false;
    let gaps = 0;
    for (let i = 1; i < keyTimes.length; i++) gaps += keyTimes[i] - keyTimes[i-1];
    return (gaps / (keyTimes.length - 1)) < FAST_KEY_MS;
  }
  function hidCommit(force) {
    clearTimeout(commitTimer);
    const v = hidInput.value.trim();
    const fast = isFastInput();
    keyTimes = [];
    if (!v) return;
    if (!force && !fast) return;
    hidInput.value = '';
    if (!hidSeen) { hidSeen = true; hidState.textContent = '✓ リーダー接続を確認しました'; }
    onScan(v);
  }
  hidInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); hidCommit(true); return; }
    if (e.key.length === 1) keyTimes.push(Date.now());
  });
  hidInput.addEventListener('input', () => {
    clearTimeout(commitTimer);
    commitTimer = setTimeout(() => hidCommit(false), 120);
  });
  $('btnManual').addEventListener('click', () => hidCommit(true));
  $('btnClear').addEventListener('click', () => { hidInput.value = ''; keyTimes = []; hidInput.focus(); });
  setInterval(() => {
    if (mode === 'hid' && document.activeElement !== hidInput) {
      const a = document.activeElement;
      if (!a || a.tagName !== 'BUTTON') hidInput.focus();
    }
  }, 700);
  document.addEventListener('keydown', e => {
    if (mode !== 'cam' || e.target === hidInput) return;
    if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;
    setMode('hid'); hidInput.value = e.key; keyTimes = [Date.now()];
  });

  // ===== モード切替 ===============================================
  function setMode(next) {
    mode = next;
    const cam = next === 'cam';
    modeCam.classList.toggle('sel', cam);
    modeHid.classList.toggle('sel', !cam);
    camWrap.style.display = cam ? 'block' : 'none';
    hidPane.style.display = cam ? 'none' : 'block';
    btnToggle.style.display = cam ? '' : 'none';
    zoomWrap.style.display = (cam && zoomWrap.dataset.ok === '1') ? 'block' : 'none';
    btnTorch.style.display = (cam && btnTorch.dataset.ok === '1') ? '' : 'none';
    if (cam) startScan(); else { stopScan(); hidInput.value = ''; keyTimes = []; hidInput.focus(); }
    idleState();
  }
  modeCam.addEventListener('click', () => { initAudio(); setMode('cam'); });
  modeHid.addEventListener('click', () => { initAudio(); setMode('hid'); });

  // ===== カメラ制御 ===============================================
  function videoTrack() {
    const v = document.querySelector('#reader video');
    return v && v.srcObject ? v.srcObject.getVideoTracks()[0] : null;
  }
  function setupCameraControls() {
    const track = videoTrack();
    if (!track || !track.getCapabilities) return;
    let caps = {};
    try { caps = track.getCapabilities() || {}; } catch (e) { return; }
    if (caps.torch) { btnTorch.dataset.ok = '1'; if (mode === 'cam') btnTorch.style.display = ''; }
    if (caps.zoom) {
      zoomWrap.dataset.ok = '1';
      if (mode === 'cam') zoomWrap.style.display = 'block';
      zoomEl.min = caps.zoom.min; zoomEl.max = caps.zoom.max;
      zoomEl.step = caps.zoom.step || 0.1;
      zoomEl.value = track.getSettings().zoom || caps.zoom.min;
    }
    try { track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
  }
  let torchOn = false;
  btnTorch.addEventListener('click', async () => {
    const track = videoTrack(); if (!track) return;
    torchOn = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      btnTorch.classList.toggle('on', torchOn);
      btnTorch.textContent = torchOn ? 'ライト：点灯' : 'ライト';
    } catch (e) { torchOn = false; }
  });
  zoomEl.addEventListener('input', async () => {
    const track = videoTrack(); if (!track) return;
    try { await track.applyConstraints({ advanced: [{ zoom: Number(zoomEl.value) }] }); } catch (e) {}
  });

  async function startScan() {
    if (running || mode !== 'cam') return;
    initAudio();
    scanner = scanner || new Html5Qrcode('reader', { verbose: false });
    try {
      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 15,
          qrbox: (w, h) => { const m = Math.floor(Math.min(w, h) * 0.85); return { width: m, height: m }; },
          aspectRatio: 1.0,
          experimentalFeatures: { useBarCodeDetectorIfSupported: true }
        },
        onScan, () => {}
      );
      running = true;
      btnToggle.textContent = 'スキャン停止';
      idleState();
      setTimeout(setupCameraControls, 600);
    } catch (err) {
      setState('err', 'カメラを起動できません：' + err);
    }
  }
  async function stopScan() {
    if (!running || !scanner) return;
    try { await scanner.stop(); } catch (e) {}
    running = false;
    btnToggle.textContent = 'スキャン開始';
  }

  // ===== イベント =================================================
  btnToggle.addEventListener('click', () => running ? (stopScan(), idleState()) : startScan());
  btnList.addEventListener('click', () => {
    const show = listWrap.style.display !== 'block';
    listWrap.style.display = show ? 'block' : 'none';
    btnList.textContent = show ? '一覧を隠す' : '一覧を表示';
    if (show) renderList();
  });
  $('btnSendNow').addEventListener('click', () => { backoff = 0; nextAllowedAt = 0; sendQueued(true); });
  $('btnCsv').addEventListener('click', exportCsv);
  btnReload.addEventListener('click', loadAll);
  btnTest.addEventListener('click', () => { initAudio(); beepOk(); });
  btnSpeak.addEventListener('click', () => {
    speakOn = !speakOn;
    btnSpeak.classList.toggle('on', speakOn);
    btnSpeak.textContent = speakOn ? '音声読み上げ：オン' : '音声読み上げ：オフ';
    if (speakOn) speak('音声読み上げを開始します');
  });
  document.querySelectorAll('#volRow button').forEach(b => {
    b.addEventListener('click', () => { initAudio(); setVolume(Number(b.dataset.v)); beepOk(); });
  });

  // ================================================================
  // 未送信ゼロになるまで警告を出し続ける
  // ================================================================
  const alertBar = $('alertBar'), alertCount = $('alertCount'), doneBar = $('doneBar');
  const NAG_AFTER_MS    = 120000;  // 未送信が2分続いたら音でも催促を開始
  const NAG_INTERVAL_MS = 60000;   // 以後1分ごとに催促
  let unsentSince = 0, lastNagAt = 0, doneTimer = null;

  function updateAlert(unsent) {
    if (unsent > 0) {
      if (!unsentSince) unsentSince = Date.now();
      alertCount.textContent = unsent;
      alertBar.classList.add('show');
      doneBar.classList.remove('show');
      clearTimeout(doneTimer);
      document.body.classList.add('has-unsent');
      return;
    }
    alertBar.classList.remove('show');
    if (unsentSince) {               // 未送信が解消した瞬間だけ緑を出す
      unsentSince = 0; lastNagAt = 0;
      doneBar.classList.add('show');
      clearTimeout(doneTimer);
      doneTimer = setTimeout(() => {
        doneBar.classList.remove('show');
        document.body.classList.remove('has-unsent');
      }, 4000);
    } else {
      document.body.classList.remove('has-unsent');
    }
  }

  // 未送信が続く間は、画面を見ていなくても分かるよう音と振動でも知らせる
  setInterval(() => {
    const unsent = viewRows.filter(r => r.status === 'queued').length;
    if (!unsent || !unsentSince) return;
    const now = Date.now();
    if (now - unsentSince < NAG_AFTER_MS) return;
    if (now - lastNagAt < NAG_INTERVAL_MS) return;
    lastNagAt = now;
    beepErr(); vibrate([120, 80, 120]);
    speak('未送信が' + unsent + '件あります');
  }, 15000);

  $('alertSend').addEventListener('click', () => { backoff = 0; nextAllowedAt = 0; sendQueued(true); });

  // 作業終了チェック：未送信が残っていれば終了させない
  $('btnFinish').addEventListener('click', async () => {
    backoff = 0; nextAllowedAt = 0;
    await sendQueued(true);
    await refreshView();
    const unsent = viewRows.filter(r => r.status === 'queued').length;
    if (unsent === 0) {
      setState('ok', '未送信 0 件。作業を終了できます', true);
      beepOk(); vibrate(200); speak('すべて送信済みです。作業を終了できます');
    } else {
      setState('err', '未送信が ' + unsent + ' 件。電波の良い場所へ移動してください', true);
      beepErr(); vibrate([120, 80, 120]); speak('未送信が' + unsent + '件あります');
    }
  });

  // ===== 起動 =====================================================
  (async function boot() {
    await openDB();
    $('storeNote').textContent = useMemory
      ? '⚠ この端末では端末内保存が使えないため、画面を閉じると未送信データが消えます。こまめに「今すぐ送信」してください。'
      : '※読み取りは端末内に保存されます。アプリを閉じても未送信データは残り、次回起動時に自動送信します。';
    const all = await dbAll();
    all.forEach(r => { registered.add(String(r.content)); if (r.seq > seqMax) seqMax = r.seq; });
    setVolume(volIdx);
    setMode('cam');
    await refreshView();
    sendQueued(true);   // 前回の未送信分を起動時にまとめて送る
  })();
</script>
</body>
</html>
