<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>QR棚卸</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --c:#14538f; --fg:#fff; --dock:0px; }
  body[data-state="waiting"]    { --c:#14538f; --fg:#fff; }
  body[data-state="processing"] { --c:#d97a00; --fg:#fff; }
  body[data-state="ok"]         { --c:#0f8f45; --fg:#fff; }
  body[data-state="dup"]        { --c:#f2c200; --fg:#2a2200; }
  body[data-state="err"]        { --c:#cc2b1d; --fg:#fff; }
  body[data-state="stopped"]    { --c:#5c6470; --fg:#fff; }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;
    background:var(--c); color:var(--fg);
    transition:background-color .12s linear; min-height:100vh;
    padding-bottom:var(--dock);
  }
  header { background:rgba(0,0,0,.38); color:#fff; padding:8px 12px; }
  .hrow { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .htitle { font-size:15px; font-weight:800; }
  #netBadge { font-size:13px; font-weight:800; padding:5px 10px; border-radius:999px;
              background:#0f8f45; color:#fff; white-space:nowrap; }
  #netBadge.wait { background:#d97a00; }
  #netBadge.off  { background:#cc2b1d; }
  #netBadge.send { background:#1f6feb; }
  #counts { font-size:12px; opacity:.92; margin-top:4px; }

  main { padding:10px; max-width:620px; margin:0 auto; }

  #modeRow { display:flex; gap:8px; margin-bottom:10px; }
  #modeRow button { flex:1; padding:14px 6px; font-size:16px; font-weight:800;
    border:3px solid rgba(255,255,255,.75); border-radius:12px;
    background:rgba(0,0,0,.18); color:var(--fg); }
  #modeRow button.sel { background:#fff; color:#16202c; border-color:#fff; }

  #camWrap { position:relative; border-radius:14px; overflow:hidden; background:#000;
    border:10px solid #fff; box-shadow:0 0 0 6px rgba(255,255,255,.25);
    transition:border-color .12s linear, box-shadow .12s linear; }
  body[data-state="ok"] #camWrap, body[data-state="dup"] #camWrap, body[data-state="err"] #camWrap {
    border-width:16px; border-color:var(--fg); box-shadow:0 0 0 10px rgba(255,255,255,.55); }
  #reader { width:100%; }
  #reader video { width:100% !important; display:block; }

  #hidPane { border:6px dashed rgba(255,255,255,.6); border-radius:14px; padding:14px;
             text-align:center; background:rgba(0,0,0,.14); }
  #hidState { font-size:17px; font-weight:800; margin-bottom:8px; }
  #hidEcho { background:#fff; color:#16202c; border-radius:10px; padding:13px 10px;
             font-size:20px; font-weight:800; min-height:50px; word-break:break-all; }
  #hidInput { position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
  #imeWarn { display:none; margin-top:8px; padding:10px; border-radius:10px;
             background:#cc2b1d; color:#fff; font-size:14px; font-weight:800; }
  .hint { font-size:12px; opacity:.9; margin-top:8px; line-height:1.6; text-align:left; }

  #panel { margin:10px 0; padding:14px 12px; border-radius:14px; background:rgba(0,0,0,.22); text-align:center; }
  body[data-state="dup"] #panel { background:rgba(0,0,0,.12); }
  #icon { font-size:64px; line-height:1; font-weight:900; }
  #label { font-size:28px; font-weight:900; margin-top:4px; letter-spacing:.04em; }
  #detail { font-size:15px; font-weight:600; margin-top:6px; opacity:.95; word-break:break-all; min-height:18px; }
  body[data-state="processing"] #panel { animation:blink .7s ease-in-out infinite alternate; }
  @keyframes blink { from{opacity:.55;} to{opacity:1;} }
  @media (prefers-reduced-motion:reduce){ #panel{animation:none !important;} }

  .row { display:flex; gap:8px; margin:8px 0; }
  button { flex:1; padding:15px 8px; font-size:16px; font-weight:800; border:none;
           border-radius:12px; color:#16202c; background:#fff; }
  button:active { transform:scale(.98); }
  button.ghost { background:rgba(255,255,255,.22); color:var(--fg); border:2px solid rgba(255,255,255,.7); }
  button.on { background:#ffe680; color:#3a2c00; }
  button.danger { background:rgba(0,0,0,.25); color:#fff; border:2px solid #ffb3ab; }
  .vol { display:flex; gap:6px; margin:8px 0; }
  .vol button { padding:12px 4px; font-size:15px; }
  .vol button.sel { background:#16202c; color:#fff; }
  .cap { font-size:12px; font-weight:700; opacity:.9; margin:12px 0 2px; }

  /* 自己診断 */
  #diag { margin-top:12px; background:rgba(0,0,0,.25); border-radius:12px; padding:10px 12px;
          font-size:13px; line-height:1.8; }
  #diag b { font-weight:800; }
  .dgood { color:#9ff0c0; font-weight:800; }
  .dbad  { color:#ffb3ab; font-weight:800; }

  #listWrap { display:none; margin-top:10px; }
  table { width:100%; border-collapse:collapse; background:#fff; color:#1a1a1a; border-radius:10px; overflow:hidden; }
  th,td { padding:8px 6px; font-size:13px; text-align:left; border-bottom:1px solid #e0e3e8; }
  th { background:#eef0f3; }
  td.s-sent{color:#0f8f45;font-weight:700;} td.s-queued{color:#d97a00;font-weight:700;}
  td.s-dup{color:#9a7b00;font-weight:700;}
  .content-cell{word-break:break-all;}
  .empty{color:#888;text-align:center;padding:16px;}
  .note{font-size:12px;opacity:.92;margin:6px 0;line-height:1.6;}

  /* 画面下に固定するドック（ズーム＋警告） */
  #dock { position:fixed; left:0; right:0; bottom:0; z-index:9999; }
  #alertBar { display:none; align-items:center; gap:10px; padding:11px 12px;
    background:#cc2b1d; color:#fff; border-top:4px solid #fff; }
  #alertBar.show { display:flex; animation:pulse 1.3s ease-in-out infinite alternate; }
  @keyframes pulse { from{background:#cc2b1d;} to{background:#8e1b11;} }
  @media (prefers-reduced-motion:reduce){ #alertBar.show{animation:none;} }
  #alertText { flex:1; font-size:16px; font-weight:900; line-height:1.3; }
  #alertText small { display:block; font-size:11px; font-weight:700; opacity:.95; margin-top:2px; }
  #alertBar button { flex:0 0 auto; padding:12px 13px; font-size:14px; background:#fff; color:#8e1b11; }
  #zoomBar { display:none; padding:9px 12px calc(9px + env(safe-area-inset-bottom));
             background:rgba(10,20,32,.93); color:#fff; align-items:center; gap:10px; }
  #zoomBar.show { display:flex; }
  #zoomBar .zl { font-size:13px; font-weight:800; white-space:nowrap; }
  #zoom { flex:1; height:40px; }
  #zoomBar button { flex:0 0 auto; padding:10px 12px; font-size:14px; }
  #doneBar { display:none; padding:14px 12px calc(14px + env(safe-area-inset-bottom));
             background:#0f8f45; color:#fff; font-size:17px; font-weight:900; text-align:center; }
  #doneBar.show { display:block; }
</style>
</head>
<body data-state="stopped">
<header>
  <div class="hrow">
    <span class="htitle">📦 QR棚卸</span>
    <span id="netBadge">起動中</span>
  </div>
  <div id="counts">読取 0 件 ／ 未送信 0 件</div>
</header>

<main>
  <div id="modeRow">
    <button id="modeCam" class="sel">📷 カメラ</button>
    <button id="modeHid">🔫 リーダー</button>
  </div>

  <div id="camWrap"><div id="reader"></div></div>

  <div id="hidPane" style="display:none;">
    <div id="hidState">リーダーの読み取り待ち</div>
    <div id="hidEcho">ここに読み取り結果が出ます</div>
    <input id="hidInput" type="email" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" inputmode="email" />
    <div id="imeWarn">⚠ 日本語入力が働いています。下の「かな対策」を押してください</div>
    <div class="row" style="margin-top:8px;">
      <button id="btnIme">かな対策：強</button>
      <button id="btnFocus" class="ghost">受付を再開</button>
    </div>
    <div class="hint">
      ・「かな対策：強」にしておくと、iPhoneの設定を変えなくても日本語変換が止まります<br>
      ・値が入らなくなったら「受付を再開」を押してください<br>
      ・リーダー側の設定：接続モード「BT HID」／ターミネーター「Enter」
    </div>
  </div>

  <div id="panel">
    <div id="icon">■</div>
    <div id="label">起動中</div>
    <div id="detail"></div>
  </div>

  <div class="row">
    <button id="btnToggle">スキャン停止</button>
    <button id="btnList" class="ghost">一覧を表示</button>
  </div>
  <div class="row">
    <button id="btnSendNow">今すぐ送信</button>
    <button id="btnCsv" class="ghost">CSV書き出し</button>
  </div>
  <div class="row">
    <button id="btnFinish">作業終了チェック</button>
  </div>
  <div class="row">
    <button id="btnTorch" class="ghost" style="display:none;">ライト</button>
    <button id="btnReload" class="ghost">シート照合</button>
  </div>

  <div class="cap">音量</div>
  <div class="vol" id="volRow">
    <button data-v="0">消音</button><button data-v="1">小</button>
    <button data-v="2">中</button><button data-v="3">大</button><button data-v="4">最大</button>
  </div>
  <div class="row">
    <button id="btnTest" class="ghost">音を確認</button>
    <button id="btnSpeak" class="ghost">音声読み上げ：オフ</button>
  </div>

  <div class="cap">状態の確認</div>
  <div id="diag">読み込み中…</div>
  <div class="row">
    <button id="btnPing" class="ghost">接続テスト</button>
    <button id="btnReset" class="danger">データ初期化</button>
  </div>
  <div class="note" id="storeNote"></div>

  <div id="listWrap">
    <table>
      <thead><tr><th>順</th><th>日時</th><th>QR内容</th><th>状態</th></tr></thead>
      <tbody id="list"><tr><td colspan="4" class="empty">まだスキャンがありません</td></tr></tbody>
    </table>
  </div>
</main>

<div id="dock">
  <div id="doneBar">✓ すべて送信済みです</div>
  <div id="alertBar">
    <div id="alertText">⚠ 未送信 <span id="alertCount">0</span> 件
      <small>送信が完了するまで作業を終了しないでください</small></div>
    <button id="alertSend">今すぐ送信</button>
  </div>
  <div id="zoomBar">
    <span class="zl">ズーム</span>
    <input type="range" id="zoom" min="1" max="4" step="0.1" value="1" />
    <button id="zoomReset">等倍</button>
  </div>
</div>

<script>
// ============ 設定 ============================================
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxTGviS-98Mww0jwSy-tPN04KXmOsHi057wBD6RyT7ZKZgQho4RlhqcQsoVAEfrz0h5/exec';
var TOKEN   = 'tana2026secret';

var SEND_INTERVAL_MS = 300000;   // 5分ごとに送信
var BATCH_SIZE       = 50;       // 1回にまとめる件数
var SEND_TIMEOUT_MS  = 20000;    // 送信の打ち切り
var BACKOFF_MAX_MS   = 600000;   // 失敗時の最大待ち（10分）
var KEEP_DAYS        = 10;       // これより古い「送信済み」は自動削除
var NEED_VERSION     = 3;        // GAS側に必要なバージョン
var DEDUP_MS         = 3000;
var HOLD_MS          = 1500;
// ==============================================================

function $(id){ return document.getElementById(id); }
var iconEl=$('icon'), labelEl=$('label'), detailEl=$('detail');
var countsEl=$('counts'), netBadge=$('netBadge'), diagEl=$('diag');
var listEl=$('list'), listWrap=$('listWrap');
var camWrap=$('camWrap'), hidPane=$('hidPane'), hidInput=$('hidInput');
var hidEcho=$('hidEcho'), hidState=$('hidState'), imeWarn=$('imeWarn');
var modeCam=$('modeCam'), modeHid=$('modeHid');
var btnToggle=$('btnToggle'), btnTorch=$('btnTorch');
var zoomBar=$('zoomBar'), zoomEl=$('zoom'), alertBar=$('alertBar'), doneBar=$('doneBar');

var vibrateSupported = ('vibrate' in navigator);

// ============ ストレージ（localStorage 単独・毎回検証） ========
// 仕組みを単純にして、確実に残ることを最優先にしています。
var LS_KEY = 'qr_tanaoroshi_v6';
var rows = [];            // すべての読み取り（これが唯一の原本）
var storageOk = true;
var storageMsg = '';

function loadRows(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    var a = raw ? JSON.parse(raw) : [];
    rows = Object.prototype.toString.call(a) === '[object Array]' ? a : [];
    storageOk = true; storageMsg = '端末内に保存しています';
  } catch(e){
    rows = []; storageOk = false;
    storageMsg = '端末内に保存できません（プライベートモードの可能性）';
  }
}
// 保存するたびに「書けたか」を読み戻して確かめる
function saveRows(){
  try {
    var json = JSON.stringify(rows);
    localStorage.setItem(LS_KEY, json);
    var back = localStorage.getItem(LS_KEY);
    if (back && back.length === json.length) {
      storageOk = true; storageMsg = '端末内に保存しています';
    } else {
      storageOk = false; storageMsg = '保存の確認が取れません';
    }
  } catch(e){
    storageOk = false;
    storageMsg = (String(e).indexOf('uota') >= 0)
      ? '端末の保存容量がいっぱいです。CSVに書き出して初期化してください'
      : '端末内に保存できません';
  }
  renderStoreNote();
  return storageOk;
}
function renderStoreNote(){
  var el = $('storeNote');
  if (storageOk) {
    el.textContent = '※読み取りは端末内に保存されます。アプリを閉じても未送信分は残ります。';
    el.style.color = '';
  } else {
    el.textContent = '⚠ ' + storageMsg + '。こまめに「今すぐ送信」または「CSV書き出し」をしてください。';
    el.style.color = '#ffd9d4';
  }
}
function uuid(){
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = (c === 'x') ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}

// ============ 画面表示 ========================================
var FACE = {
  waiting:{icon:'▣',label:'読み取り待ち'}, processing:{icon:'⟳',label:'送信中'},
  ok:{icon:'✓',label:'記録しました'},     dup:{icon:'↺',label:'登録済み（重複）'},
  err:{icon:'✕',label:'エラー'},          stopped:{icon:'■',label:'停止中'}
};
var holdTimer = null, mode = 'cam', running = false, scanner = null;
function setState(type, detail, hold){
  clearTimeout(holdTimer);
  document.body.dataset.state = type;
  iconEl.textContent = FACE[type].icon;
  labelEl.textContent = FACE[type].label;
  detailEl.textContent = detail || '';
  if (hold) holdTimer = setTimeout(idleState, HOLD_MS);
}
function idleState(){
  clearTimeout(holdTimer);
  if (mode === 'hid') { setState('waiting','リーダーで読み取ってください'); return; }
  if (running) setState('waiting','QRコードをかざしてください');
  else setState('stopped','「スキャン開始」を押してください');
}
function nowStr(){
  var d = new Date(), p = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '
       + p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function vibrate(p){ if (vibrateSupported) { try{ navigator.vibrate(p||200); }catch(e){} } }

function unsentCount(){
  var n = 0;
  for (var i=0;i<rows.length;i++) if (rows[i].status === 'queued') n++;
  return n;
}
function sentCount(){
  var n = 0;
  for (var i=0;i<rows.length;i++) if (rows[i].status === 'sent') n++;
  return n;
}

var sending = false, lastSendAt = 0, lastSendMsg = '未送信', nextAllowedAt = 0, backoff = 0;
var serverOk = null, serverVersion = 0;

function paint(){
  var un = unsentCount();
  countsEl.textContent = '読取 ' + rows.length + ' 件 ／ 未送信 ' + un + ' 件';
  if (sending)           { netBadge.className='send'; netBadge.textContent='送信中…'; }
  else if (!navigator.onLine) { netBadge.className='off'; netBadge.textContent='🔴 圏外 '+un+'件保留'; }
  else if (un > 0)       { netBadge.className='wait'; netBadge.textContent='🟡 未送信 '+un+'件'; }
  else                   { netBadge.className='';     netBadge.textContent='🟢 送信済み'; }
  updateAlert(un);
  renderDiag();
  if (listWrap.style.display === 'block') renderList();
}
function renderList(){
  if (!rows.length) {
    listEl.innerHTML = '<tr><td colspan="4" class="empty">まだスキャンがありません</td></tr>';
    return;
  }
  var LABEL = { queued:'未送信', sent:'送信済', dup:'重複' };
  var view = rows.slice().sort(function(a,b){ return b.seq - a.seq; }).slice(0,200);
  listEl.innerHTML = view.map(function(r){
    return '<tr><td>'+r.seq+'</td><td>'+esc(r.scannedAt)+'</td>'
         + '<td class="content-cell">'+esc(r.content)+'</td>'
         + '<td class="s-'+r.status+'">'+(LABEL[r.status]||r.status)+'</td></tr>';
  }).join('');
}
function renderDiag(){
  var un = unsentCount();
  var nextIn = nextAllowedAt > Date.now()
    ? Math.ceil((nextAllowedAt - Date.now())/1000) + '秒後'
    : Math.ceil(SEND_INTERVAL_MS/60000) + '分ごと';
  var srv = (serverOk === null) ? '<span class="dbad">未確認</span>'
    : (!serverOk ? '<span class="dbad">つながりません</span>'
    : (serverVersion >= NEED_VERSION
        ? '<span class="dgood">OK（v'+serverVersion+'）</span>'
        : '<span class="dbad">旧バージョン（v'+(serverVersion||'?')+'）※GASを更新してください</span>'));
  diagEl.innerHTML =
      '<b>保存：</b>' + (storageOk ? '<span class="dgood">OK</span>' : '<span class="dbad">NG</span>')
    + '（' + storageMsg + '）<br>'
    + '<b>件数：</b>全 ' + rows.length + ' ／ 送信済 ' + sentCount() + ' ／ <b>未送信 ' + un + '</b><br>'
    + '<b>送信先：</b>' + srv + '<br>'
    + '<b>最後の送信：</b>' + (lastSendAt ? nowFrom(lastSendAt) + '（' + lastSendMsg + '）' : 'まだありません') + '<br>'
    + '<b>次の送信：</b>' + nextIn;
}
function nowFrom(ts){
  var d = new Date(ts), p = function(n){ return (n<10?'0':'')+n; };
  return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

// ============ 音 ==============================================
var VOL = [0,0.2,0.5,1.0,1.8], volIdx = 3, audioCtx=null, master=null, comp=null;
function initAudio(){
  try{
    if (!audioCtx){
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 12;
      master = audioCtx.createGain(); master.gain.value = VOL[volIdx];
      comp.connect(master); master.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function setVolume(i){
  volIdx = i;
  if (master) master.gain.value = VOL[i];
  var bs = document.querySelectorAll('#volRow button');
  for (var k=0;k<bs.length;k++) bs[k].className = (Number(bs[k].dataset.v)===i ? 'sel' : '');
}
function tone(f,dur,delay){
  if (!audioCtx || VOL[volIdx] === 0) return;
  try{
    var t = audioCtx.currentTime + (delay||0);
    var osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type='square'; osc.frequency.value=f;
    osc.connect(g); g.connect(comp);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.6,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.start(t); osc.stop(t+dur+0.02);
  }catch(e){}
}
function beepOk(){ tone(1180,.10,0); tone(1570,.12,.09); }
function beepDup(){ tone(760,.14,0); tone(760,.14,.20); }
function beepErr(){ tone(300,.22,0); tone(240,.30,.26); }

var speakOn = false;
function speak(t){
  if (!speakOn || !('speechSynthesis' in window)) return;
  try{
    var u = new SpeechSynthesisUtterance(t);
    u.lang='ja-JP'; u.rate=1.15;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
document.addEventListener('touchstart', initAudio, {once:true});
document.addEventListener('click', initAudio, {once:true});

// ============ 文字の正規化（日本語変換の後始末） ==============
// 全角で入ってきた英数字・記号を半角に直します。
function normalize(s){
  s = String(s).replace(/[！-～]/g, function(c){
    return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
  }).replace(/　/g,' ')
    .replace(/、/g,',').replace(/，/g,',')
    .replace(/。/g,'.').replace(/．/g,'.')
    .replace(/・/g,'/');
  // 「ー」は長音にも使うため、かなを含まないときだけハイフンに直す
  if (!/[ぁ-んァ-ヶ一-龠]/.test(s.replace(/ー/g,''))) s = s.replace(/[ー‐–—]/g,'-');
  return s.replace(/[\r\n\t]/g,'').trim();
}

// ============ 読み取り ========================================
var lastContent = null, lastAt = 0, seqMax = 0;
var registered = {};   // 重複判定（端末内 ＋ シート照合）

function onScan(text){
  var code = normalize(text);
  if (!code) return;
  var now = Date.now();
  if (code === lastContent && now - lastAt < DEDUP_MS) return;
  lastContent = code; lastAt = now;

  if (registered[code]) {
    setState('dup', code, true);
    beepDup(); vibrate([60,60,60]); speak('登録済みです');
    return;
  }
  var row = { uuid:uuid(), seq:++seqMax, content:code, scannedAt:nowStr(),
              ts:now, status:'queued', device:String(navigator.userAgent).slice(0,100) };
  rows.push(row);
  var ok = saveRows();
  registered[code] = 1;

  if (ok) { setState('ok', code, true); beepOk(); vibrate(200); speak('記録しました'); }
  else    { setState('err','保存できません：'+code, true); beepErr(); vibrate([120,80,120]); speak('保存できません'); }
  paint();
}

// ============ 送信 ============================================
function postJson(payload){
  var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, SEND_TIMEOUT_MS);
  var opt = { method:'POST',
              headers:{'Content-Type':'text/plain;charset=utf-8'},
              body: JSON.stringify(payload) };
  if (ctl) opt.signal = ctl.signal;
  return fetch(GAS_URL, opt).then(function(res){
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }, function(e){ clearTimeout(timer); throw e; });
}

function sendQueued(manual){
  if (sending) return Promise.resolve();
  var queued = rows.filter(function(r){ return r.status === 'queued'; });
  if (!queued.length) { backoff = 0; nextAllowedAt = 0; paint(); return Promise.resolve(); }
  if (!manual && Date.now() < nextAllowedAt) { paint(); return Promise.resolve(); }
  if (!navigator.onLine) { paint(); return Promise.resolve(); }

  queued.sort(function(a,b){ return a.seq - b.seq; });
  var batch = queued.slice(0, BATCH_SIZE);
  sending = true; paint();

  return postJson({
    token: TOKEN,
    rows: batch.map(function(r){
      return { uuid:r.uuid, content:r.content, scannedAt:r.scannedAt, device:r.device };
    })
  }).then(function(data){
    if (!data || data.ok !== true) throw new Error((data && data.error) || '応答が不正です');
    serverOk = true; serverVersion = Number(data.version || 0);
    if (serverVersion < NEED_VERSION) throw new Error('GASが旧バージョンです（要更新）');

    var acc = data.accepted || [], dup = data.duplicated || [];
    var accMap = {}, dupMap = {}, i;
    for (i=0;i<acc.length;i++) accMap[acc[i]] = 1;
    for (i=0;i<dup.length;i++) dupMap[dup[i]] = 1;

    // サーバーが1件も受理していないのに「送信済み」にはしない
    if (!acc.length && !dup.length) throw new Error('サーバーが1件も受理しませんでした');

    var changed = 0;
    for (i=0;i<batch.length;i++){
      var r = batch[i];
      if (dupMap[r.uuid]) { r.status='dup';  r.sentAt=nowStr(); changed++; }
      else if (accMap[r.uuid]) { r.status='sent'; r.sentAt=nowStr(); changed++; }
    }
    saveRows();
    lastSendAt = Date.now(); lastSendMsg = '成功 ' + changed + '件';
    backoff = 0; nextAllowedAt = 0;
    sending = false; paint();

    // まだ残っていれば続けて送る
    if (unsentCount() > 0 && manual) return sendQueued(true);
  }).catch(function(e){
    sending = false;
    serverOk = (String(e.message||e).indexOf('GAS') >= 0) ? true : false;
    backoff = backoff ? Math.min(backoff*2, BACKOFF_MAX_MS) : 60000;
    nextAllowedAt = Date.now() + backoff;
    lastSendAt = Date.now();
    lastSendMsg = '失敗：' + (e.message || e);
    paint();
  });
}

function ping(){
  var url = GAS_URL + '?action=ping&token=' + encodeURIComponent(TOKEN);
  var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, SEND_TIMEOUT_MS);
  var opt = ctl ? {signal:ctl.signal} : {};
  return fetch(url, opt).then(function(r){ clearTimeout(timer); return r.json(); })
    .then(function(d){
      serverOk = (d && d.ok === true);
      serverVersion = Number((d && d.version) || 0);
      paint();
      return d;
    }).catch(function(e){
      clearTimeout(timer);
      serverOk = false; paint(); throw e;
    });
}

setInterval(function(){ sendQueued(false); }, SEND_INTERVAL_MS);
setInterval(renderDiag, 10000);
window.addEventListener('online', function(){
  backoff = 0; nextAllowedAt = 0; sendQueued(true);
});
window.addEventListener('offline', paint);
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') {
    paint();
    if (mode === 'cam' && !running) startScan();
  }
});
window.addEventListener('beforeunload', function(e){
  if (unsentCount() > 0) { e.preventDefault(); e.returnValue = ''; }
});

// ============ 未送信の警告 ====================================
var alertCount = $('alertCount'), unsentSince = 0, lastNagAt = 0, doneTimer = null;
function updateAlert(un){
  if (un > 0) {
    if (!unsentSince) unsentSince = Date.now();
    alertCount.textContent = un;
    alertBar.className = 'show';
    doneBar.className = '';
    clearTimeout(doneTimer);
  } else {
    alertBar.className = '';
    if (unsentSince) {
      unsentSince = 0; lastNagAt = 0;
      doneBar.className = 'show';
      clearTimeout(doneTimer);
      doneTimer = setTimeout(function(){ doneBar.className=''; fitDock(); }, 4000);
    }
  }
  fitDock();
}
setInterval(function(){
  var un = unsentCount();
  if (!un || !unsentSince) return;
  var now = Date.now();
  if (now - unsentSince < 180000) return;      // 3分続いたら
  if (now - lastNagAt < 120000) return;        // 以後2分ごと
  lastNagAt = now;
  beepErr(); vibrate([120,80,120]); speak('未送信が' + un + '件あります');
}, 20000);

function fitDock(){
  var h = $('dock').offsetHeight || 0;
  document.documentElement.style.setProperty('--dock', h + 'px');
}
window.addEventListener('resize', fitDock);

// ============ リーダー（HID）入力 =============================
// 入力欄は画面外に置き、受け取った文字だけを大きく表示します。
var keyBuf = '', keyTimes = [], commitTimer = null, hidSeen = false, imeStrong = true;

function hidShow(v){ hidEcho.textContent = v || 'ここに読み取り結果が出ます'; }
function hidCommit(force){
  clearTimeout(commitTimer);
  var v = normalize(hidInput.value || keyBuf);
  hidInput.value = ''; keyBuf = ''; keyTimes = [];
  hidShow('');
  if (!v) return;
  var fast = isFast();
  if (!force && !fast) return;
  if (!hidSeen) { hidSeen = true; hidState.textContent = '✓ リーダー接続を確認しました'; }
  onScan(v);
}
function isFast(){
  if (keyTimes.length < 3) return false;
  var gaps = 0;
  for (var i=1;i<keyTimes.length;i++) gaps += keyTimes[i] - keyTimes[i-1];
  return (gaps/(keyTimes.length-1)) < 70;
}
hidInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter') { e.preventDefault(); hidCommit(true); return; }
  if (e.key && e.key.length === 1) keyTimes.push(Date.now());
});
hidInput.addEventListener('input', function(){
  hidShow(normalize(hidInput.value));
  clearTimeout(commitTimer);
  commitTimer = setTimeout(function(){ hidCommit(false); }, 150);
});
// 日本語変換が動いたら知らせる
hidInput.addEventListener('compositionstart', function(){ imeWarn.style.display = 'block'; });
hidInput.addEventListener('compositionend', function(){
  setTimeout(function(){ imeWarn.style.display = 'none'; }, 2500);
});

function setIme(strong){
  imeStrong = strong;
  // email 入力欄は iOS で英数字入力になり、日本語変換が働きません
  hidInput.type = strong ? 'email' : 'text';
  hidInput.inputMode = strong ? 'email' : 'text';
  $('btnIme').textContent = 'かな対策：' + (strong ? '強' : '弱');
  $('btnIme').className = strong ? 'on' : '';
  imeWarn.style.display = 'none';
  focusHid();
}
function focusHid(){
  if (mode !== 'hid') return;
  try { hidInput.focus(); } catch(e){}
}
$('btnIme').addEventListener('click', function(){ setIme(!imeStrong); });
$('btnFocus').addEventListener('click', function(){ hidInput.value=''; keyBuf=''; focusHid(); });
hidPane.addEventListener('click', function(e){
  if (e.target.tagName !== 'BUTTON') focusHid();
});

// ============ モード切替 ======================================
function setMode(next){
  mode = next;
  var cam = (next === 'cam');
  modeCam.className = cam ? 'sel' : '';
  modeHid.className = cam ? '' : 'sel';
  camWrap.style.display = cam ? 'block' : 'none';
  hidPane.style.display = cam ? 'none' : 'block';
  btnToggle.style.display = cam ? '' : 'none';
  btnTorch.style.display = (cam && btnTorch.dataset.ok === '1') ? '' : 'none';
  zoomBar.className = (cam && zoomBar.dataset.ok === '1') ? 'show' : '';
  if (cam) { startScan(); }
  else { stopScan(); hidInput.value=''; keyBuf=''; hidShow(''); focusHid(); }
  idleState(); fitDock();
}
modeCam.addEventListener('click', function(){ initAudio(); setMode('cam'); });
modeHid.addEventListener('click', function(){ initAudio(); setMode('hid'); });

// ============ カメラ ==========================================
function videoTrack(){
  var v = document.querySelector('#reader video');
  try { return (v && v.srcObject) ? v.srcObject.getVideoTracks()[0] : null; } catch(e){ return null; }
}
function setupCameraControls(){
  var track = videoTrack();
  if (!track || !track.getCapabilities) return;
  var caps = {};
  try { caps = track.getCapabilities() || {}; } catch(e){ return; }
  if (caps.torch) { btnTorch.dataset.ok='1'; if (mode==='cam') btnTorch.style.display=''; }
  if (caps.zoom) {
    zoomBar.dataset.ok='1';
    if (mode==='cam') zoomBar.className='show';
    zoomEl.min = caps.zoom.min; zoomEl.max = caps.zoom.max;
    zoomEl.step = caps.zoom.step || 0.1;
    try { zoomEl.value = track.getSettings().zoom || caps.zoom.min; } catch(e){}
    fitDock();
  }
  try { track.applyConstraints({ advanced:[{ focusMode:'continuous' }] }); } catch(e){}
}
var torchOn = false;
btnTorch.addEventListener('click', function(){
  var track = videoTrack(); if (!track) return;
  torchOn = !torchOn;
  try {
    track.applyConstraints({ advanced:[{ torch:torchOn }] });
    btnTorch.className = torchOn ? 'on' : 'ghost';
    btnTorch.textContent = torchOn ? 'ライト：点灯' : 'ライト';
  } catch(e){ torchOn = false; }
});
function applyZoom(v){
  var track = videoTrack(); if (!track) return;
  try { track.applyConstraints({ advanced:[{ zoom:Number(v) }] }); } catch(e){}
}
zoomEl.addEventListener('input', function(){ applyZoom(zoomEl.value); });
$('zoomReset').addEventListener('click', function(){ zoomEl.value = zoomEl.min; applyZoom(zoomEl.min); });

function startScan(){
  if (running || mode !== 'cam') return;
  initAudio();
  try { scanner = scanner || new Html5Qrcode('reader', {verbose:false}); }
  catch(e){ setState('err','読み取り機能を読み込めません。通信がある場所で開き直してください'); return; }
  scanner.start(
    { facingMode:'environment' },
    { fps:15,
      qrbox: function(w,h){ var m = Math.floor(Math.min(w,h)*0.85); return {width:m,height:m}; },
      aspectRatio:1.0,
      experimentalFeatures:{ useBarCodeDetectorIfSupported:true } },
    onScan, function(){}
  ).then(function(){
    running = true; btnToggle.textContent = 'スキャン停止';
    idleState(); setTimeout(setupCameraControls, 600);
  }).catch(function(err){
    running = false; setState('err','カメラを起動できません：' + err);
  });
}
function stopScan(){
  if (!running || !scanner) return Promise.resolve();
  return scanner.stop().then(function(){
    running = false; btnToggle.textContent = 'スキャン開始';
  }).catch(function(){ running = false; });
}

// ============ シート照合 ======================================
function loadAll(){
  setState('processing','シートを照合中');
  var url = GAS_URL + '?action=list&limit=3000&token=' + encodeURIComponent(TOKEN);
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    if (d && d.ok) {
      var list = d.rows || [];
      for (var i=0;i<list.length;i++) registered[normalize(list[i].content)] = 1;
      serverOk = true; serverVersion = Number(d.version||0);
      setState('ok','シートの ' + list.length + ' 件を重複判定に反映しました', true); beepOk();
    } else {
      setState('err','シートを照合できません', true); beepErr();
    }
    paint();
  }).catch(function(){
    serverOk = false;
    setState('err','シートを照合できません（通信エラー）', true); beepErr(); paint();
  });
}

// ============ CSV ============================================
function exportCsv(){
  if (!rows.length) { setState('err','書き出すデータがありません', true); return; }
  var head = 'uuid,seq,scannedAt,content,status\n';
  var body = rows.slice().sort(function(a,b){ return a.seq-b.seq; }).map(function(r){
    return [r.uuid, r.seq, r.scannedAt, '"'+String(r.content).replace(/"/g,'""')+'"', r.status].join(',');
  }).join('\n');
  try {
    var blob = new Blob(['﻿'+head+body], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tanaoroshi_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 3000);
    setState('ok','CSVを書き出しました（' + rows.length + '件）', true); beepOk();
  } catch(e){
    setState('err','CSVを書き出せません', true); beepErr();
  }
}

// ============ 10日で自動リフレッシュ ==========================
// 未送信は何日経っても消しません。消すのは送信済みだけです。
function purgeOld(){
  var limit = Date.now() - KEEP_DAYS*86400000;
  var before = rows.length;
  rows = rows.filter(function(r){
    return r.status === 'queued' || (r.ts || 0) >= limit;
  });
  if (rows.length !== before) { saveRows(); rebuildIndex(); }
  return before - rows.length;
}
function rebuildIndex(){
  registered = {}; seqMax = 0;
  for (var i=0;i<rows.length;i++){
    registered[rows[i].content] = 1;
    if (rows[i].seq > seqMax) seqMax = rows[i].seq;
  }
}
setInterval(purgeOld, 3600000);

$('btnReset').addEventListener('click', function(){
  var un = unsentCount();
  if (un > 0) {
    if (!confirm('未送信が ' + un + ' 件あります。\n送信済みの ' + (rows.length-un) + ' 件だけを消しますか？\n（未送信は残ります）')) return;
  } else {
    if (!confirm('端末内の ' + rows.length + ' 件を消します。よろしいですか？')) return;
  }
  rows = rows.filter(function(r){ return r.status === 'queued'; });
  saveRows(); rebuildIndex(); paint();
  setState('ok','端末内のデータを初期化しました', true); beepOk();
});

// ============ ボタン ==========================================
btnToggle.addEventListener('click', function(){
  if (running) { stopScan().then(idleState); } else { startScan(); }
});
$('btnList').addEventListener('click', function(){
  var show = (listWrap.style.display !== 'block');
  listWrap.style.display = show ? 'block' : 'none';
  $('btnList').textContent = show ? '一覧を隠す' : '一覧を表示';
  if (show) renderList();
});
$('btnSendNow').addEventListener('click', function(){
  backoff = 0; nextAllowedAt = 0; sendQueued(true);
});
$('alertSend').addEventListener('click', function(){
  backoff = 0; nextAllowedAt = 0; sendQueued(true);
});
$('btnCsv').addEventListener('click', exportCsv);
$('btnReload').addEventListener('click', loadAll);
$('btnPing').addEventListener('click', function(){
  setState('processing','接続を確認中');
  ping().then(function(d){
    if (d && d.ok && Number(d.version||0) >= NEED_VERSION) {
      setState('ok','送信先に接続できました（v'+d.version+'）', true); beepOk();
    } else {
      setState('err','送信先のGASが古いか、設定が違います', true); beepErr();
    }
  }).catch(function(){
    setState('err','送信先に接続できません', true); beepErr();
  });
});
$('btnFinish').addEventListener('click', function(){
  backoff = 0; nextAllowedAt = 0;
  setState('processing','送信を確認中');
  sendQueued(true).then(function(){
    var un = unsentCount();
    if (un === 0) {
      setState('ok','未送信 0 件。作業を終了できます', true);
      beepOk(); vibrate(200); speak('すべて送信済みです');
    } else {
      setState('err','未送信が ' + un + ' 件。電波の良い場所へ移動してください', true);
      beepErr(); vibrate([120,80,120]); speak('未送信が'+un+'件あります');
    }
  });
});
$('btnTest').addEventListener('click', function(){ initAudio(); beepOk(); });
$('btnSpeak').addEventListener('click', function(){
  speakOn = !speakOn;
  $('btnSpeak').className = speakOn ? 'on' : 'ghost';
  $('btnSpeak').textContent = speakOn ? '音声読み上げ：オン' : '音声読み上げ：オフ';
  if (speakOn) speak('音声読み上げを開始します');
});
(function(){
  var bs = document.querySelectorAll('#volRow button');
  for (var i=0;i<bs.length;i++) (function(b){
    b.addEventListener('click', function(){ initAudio(); setVolume(Number(b.dataset.v)); beepOk(); });
  })(bs[i]);
})();

// ============ 起動 ============================================
(function boot(){
  loadRows();
  renderStoreNote();
  rebuildIndex();
  purgeOld();
  setVolume(3);
  setIme(true);
  setMode('cam');
  paint();
  fitDock();
  ping().then(function(){ sendQueued(true); }).catch(function(){ paint(); });
})();
</script>
