<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>QR棚卸</title>
<!-- QR読み取りライブラリ (html5-qrcode) -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --ok: #1b8a4b; --err: #c0392b; --dup: #b8860b;
    --pending: #555; --bg: #f4f5f7; --card: #fff; --line: #e0e3e8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    background: var(--bg); color: #1a1a1a;
  }
  header { padding: 12px 16px; font-size: 18px; font-weight: 700; background: #222; color: #fff; }
  main { padding: 12px; max-width: 560px; margin: 0 auto; }
  #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
  .status {
    margin: 10px 0; padding: 12px 14px; border-radius: 10px; font-weight: 600;
    font-size: 15px; text-align: center; color: #fff; background: var(--pending);
    min-height: 20px;
  }
  .status.ok { background: var(--ok); }
  .status.err { background: var(--err); }
  .status.dup { background: var(--dup); }
  .status.pending { background: var(--pending); }
  .row { display: flex; gap: 8px; margin: 10px 0; }
  button {
    flex: 1; padding: 14px; font-size: 16px; font-weight: 700; border: none;
    border-radius: 10px; color: #fff; background: #2d6cdf; cursor: pointer;
  }
  button.stop { background: #777; }
  button.list { background: #4a4a4a; }
  button:active { opacity: .85; }
  .note { font-size: 12px; color: #777; margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
  th, td { padding: 8px 6px; font-size: 13px; text-align: left; border-bottom: 1px solid var(--line); }
  th { background: #efefef; }
  td.s-ok { color: var(--ok); font-weight: 700; }
  td.s-err { color: var(--err); font-weight: 700; }
  td.s-pending { color: var(--pending); }
  .content-cell { word-break: break-all; }
  .empty { color: #999; text-align: center; padding: 16px; }
</style>
</head>
<body>
<header>📦 QR棚卸</header>
<main>
  <div id="reader"></div>

  <div id="status" class="status pending">起動中…</div>

  <div class="row">
    <button id="btnToggle" class="stop">スキャン停止</button>
    <button id="btnList" class="list">スキャン一覧</button>
  </div>
  <div id="vibNote" class="note" style="display:none;">
    ※この端末は振動非対応のため、画面表示でお知らせします。
  </div>

  <table>
    <thead>
      <tr><th>順</th><th>日時</th><th>QR内容</th><th>状態</th></tr>
    </thead>
    <tbody id="list">
      <tr><td colspan="4" class="empty">まだスキャンがありません</td></tr>
    </tbody>
  </table>
</main>

<script>
  // ===== 設定 =====================================================
  // GASをWebアプリとしてデプロイしたURL（/exec で終わるもの）に書き換える
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwVKU0yYNb4v2VhaTcDAq_lI8j2dYwxgpUZ1VkpGMFukv_titrQAuRrzWn_x71sieY4/exec'; // 例: https://script.google.com/macros/s/XXXXXXXX/exec に置き換える
  // GAS側で TOKEN を設定した場合のみ同じ値を入れる（未使用なら空のまま）
  const TOKEN = 'nike2026'; // GAS側と一致させる。未使用なら空文字 ''
  const DEDUP_MS = 3000; // 同一コードの重複登録を防ぐ時間(ミリ秒)
  // ================================================================

  const statusEl = document.getElementById('status');
  const listEl   = document.getElementById('list');
  const btnToggle = document.getElementById('btnToggle');
  const btnList   = document.getElementById('btnList');

  const vibrateSupported = 'vibrate' in navigator;
  if (!vibrateSupported) document.getElementById('vibNote').style.display = 'block';

  let items = [];          // 画面表示用のスキャン一覧
  let counter = 0;         // 読み取り順
  let lastContent = null, lastAt = 0; // 連打防止用
  let scanner = null, running = false;
  const registered = new Set(); // 登録済みQR内容（二重登録の防止）

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + (type || 'pending');
  }

  function formatNow() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
      + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function render() {
    if (items.length === 0) {
      listEl.innerHTML = '<tr><td colspan="4" class="empty">まだスキャンがありません</td></tr>';
      return;
    }
    listEl.innerHTML = items.map(it => {
      const cls = it.status === '登録成功' ? 's-ok'
                : it.status === '登録失敗' ? 's-err' : 's-pending';
      return '<tr>'
        + '<td>' + it.order + '</td>'
        + '<td>' + it.time + '</td>'
        + '<td class="content-cell">' + escapeHtml(it.content) + '</td>'
        + '<td class="' + cls + '">' + it.status + '</td>'
        + '</tr>';
    }).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function vibrate(pattern) {
    if (vibrateSupported) navigator.vibrate(pattern || 200);
  }

  // ===== 音（Web Audio API・音声ファイル不要） =====
  let audioCtx = null;
  // スマホは最初のユーザー操作があるまで音を鳴らせないため、初回タップで有効化
  function initAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  // freq:周波数(Hz) dur:長さ(秒) vol:音量
  function tone(freq, dur, vol) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function beepOk()  { tone(880, 0.15, 0.35); }                 // 「ピッ」高音
  function beepErr() { tone(300, 0.18, 0.35); setTimeout(() => tone(300, 0.18, 0.35), 200); } // 低音×2
  function beepDup() { tone(520, 0.12, 0.30); }                 // 「ポッ」中音（重複）

  // 初回タップ／クリックで音を有効化
  document.addEventListener('touchstart', initAudio, { once: true });
  document.addEventListener('click', initAudio, { once: true });

  // QR読み取り成功時のコールバック（常時連続で呼ばれる）
  function onScan(decodedText) {
    const now = Date.now();
    // 同じコードがカメラに映り続ける間は一定時間に1回だけ処理（連打・連続音の防止）
    if (decodedText === lastContent && now - lastAt < DEDUP_MS) return;
    lastContent = decodedText;
    lastAt = now;

    // 既に登録済みのQRは登録しない
    if (registered.has(decodedText)) {
      setStatus('↺ 登録済み（重複のため登録しません）: ' + decodedText, 'dup');
      beepDup(); vibrate(60);
      return;
    }

    vibrate(200);  // 振動
    beepOk();      // 「ピッ」と鳴らす
    register(decodedText);
  }

  // スプレッドシートへ即時登録
  async function register(content) {
    const item = { order: ++counter, time: formatNow(), content, status: '登録中' };
    items.unshift(item);
    render();
    setStatus('登録中… ' + content, 'pending');

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        // text/plain にすることでCORSプリフライトを回避（GAS Webアプリの定石）
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ content, device: navigator.userAgent, token: TOKEN })
      });
      const data = await res.json();
      if (data.ok) {
        item.status = '登録成功';
        registered.add(content);
        if (data.timestamp) item.time = data.timestamp;
        setStatus('✓ 登録成功: ' + content, 'ok');
      } else if (data.duplicate) {
        // 既にシートに存在 → 登録せず、一覧の仮表示も取り消す
        items = items.filter(x => x !== item);
        registered.add(content);
        setStatus('↺ 登録済み（重複のため登録しません）: ' + content, 'dup');
        beepDup();
      } else {
        item.status = '登録失敗';
        setStatus('✗ 登録失敗: ' + content + '（' + (data.error || '') + '）', 'err');
        beepErr(); vibrate([100, 80, 100]);
      }
    } catch (err) {
      item.status = '登録失敗';
      setStatus('✗ 登録失敗（通信エラー）: ' + content, 'err');
      beepErr(); vibrate([100, 80, 100]);
    }
    render();
  }

  // スプレッドシートから最新一覧を取得して表示
  async function loadAll() {
    setStatus('一覧を取得中…', 'pending');
    try {
      const res = await fetch(GAS_URL + '?action=list&limit=100&token=' + encodeURIComponent(TOKEN));
      const data = await res.json();
      if (data.ok) {
        const total = data.rows.length;
        items = data.rows.map((r, i) => ({
          order: total - i, time: r.timestamp, content: r.content, status: r.status
        }));
        counter = total;
        // 取得済みの内容を登録済みセットに反映（以後の重複を即判定）
        data.rows.forEach(r => registered.add(String(r.content)));
        render();
        setStatus('スプレッドシートの最新一覧を表示しました', 'ok');
      } else {
        setStatus('一覧取得に失敗しました', 'err');
      }
    } catch (e) {
      setStatus('一覧取得に失敗しました', 'err');
    }
  }

  // ===== スキャン開始/停止 =====
  async function startScan() {
    if (running) return;
    initAudio(); // 音を有効化
    scanner = scanner || new Html5Qrcode('reader');
    try {
      await scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScan,
        () => {} // 読み取り失敗（フレーム毎）は無視
      );
      running = true;
      btnToggle.textContent = 'スキャン停止';
      btnToggle.className = 'stop';
      setStatus('スキャン中… QRコードをかざしてください', 'pending');
    } catch (err) {
      setStatus('カメラを起動できません: ' + err, 'err');
    }
  }

  async function stopScan() {
    if (!running || !scanner) return;
    await scanner.stop();
    running = false;
    btnToggle.textContent = 'スキャン開始';
    btnToggle.className = '';
    setStatus('停止中', 'pending');
  }

  btnToggle.addEventListener('click', () => running ? stopScan() : startScan());
  btnList.addEventListener('click', loadAll);

  // 起動と同時に常時スキャン開始
  window.addEventListener('load', startScan);
</script>
</body>
</html>
